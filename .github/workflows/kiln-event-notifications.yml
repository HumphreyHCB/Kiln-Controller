name: Kiln event notifications

# Only Issue comments trigger this workflow. Normal 20-minute Issue edits
# do not start any notification Actions runs.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  notify-owner:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == 'HumphreyHCB' &&
      contains(github.event.comment.body, '<!-- KILN_EVENT_NOTIFY:')
    runs-on: ubuntu-latest
    steps:
      - name: Mention owner from GitHub Actions bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          original = event["comment"]["body"]
          if "Kiln controller successfully started" in original:
              summary = "✅ Kiln controller started successfully."
          elif "Possible unexpected power loss" in original or "ended without a clean stop" in original:
              summary = "🚨 Possible unexpected shutdown — kiln requires manual inspection."
          else:
              summary = "🚨 Kiln fault detected — check the controller."
          repo = os.environ["GH_REPO"]
          issue = os.environ["ISSUE_NUMBER"]
          cid = os.environ["COMMENT_ID"]
          url = f"https://github.com/{repo}/issues/{issue}#issuecomment-{cid}"
          subprocess.run([
              "gh", "issue", "comment", issue, "--repo", repo,
              "--body", f"@HumphreyHCB {summary}\n\n[View event details]({url})",
          ], check=True)
          PY
